<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Light theme gradient (deep royal indigo to purple) -->
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    
    <!-- Dark theme gradient (vibrant Neo-Pop yellow to orange) -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <style>
    /* Styling the infinite blueprint guidelines */
    .guideline {
      stroke: #64748b;
      stroke-width: 0.75px;
      opacity: 0.18;
    }
    .guideline-dashed {
      stroke: #64748b;
      stroke-width: 0.75px;
      stroke-dasharray: 3 3;
      opacity: 0.22;
    }
    
    /* Styling the geometric chevron logo shapes */
    .logo-shape {
      fill: url(#lightGrad);
      filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.12));
      transition: fill 0.3s ease;
    }

    /* System theme integration: Morph colors instantly in dark browser tabs */
    @media (prefers-color-scheme: dark) {
      .guideline, .guideline-dashed {
        stroke: #94a3b8;
        opacity: 0.25;
      }
      .logo-shape {
        fill: url(#darkGrad);
        filter: drop-shadow(0px 4px 12px rgba(250, 204, 21, 0.15));
      }
    }
  </style>

  <!-- Architectural Drafting Guidelines (Infinite hairlines crossing the canvas) -->
  <!-- Horizontal guides -->
  <line x1="0" y1="28" x2="128" y2="28" class="guideline-dashed" />
  <line x1="0" y1="64" x2="128" y2="64" class="guideline" />
  <line x1="0" y1="100" x2="128" y2="100" class="guideline-dashed" />

  <!-- Vertical guides -->
  <line x1="36" y1="0" x2="36" y2="128" class="guideline" />
  <line x1="52" y1="0" x2="52" y2="128" class="guideline" />
  <line x1="96" y1="0" x2="96" y2="128" class="guideline-dashed" />

  <!-- Diagonal projection guides -->
  <line x1="0" y1="0" x2="128" y2="128" class="guideline" />
  <line x1="128" y1="0" x2="0" y2="128" class="guideline" />
  <line x1="0" y1="16" x2="112" y2="128" class="guideline-dashed" />
  <line x1="16" y1="0" x2="128" y2="112" class="guideline-dashed" />

  <!-- The Geometric Mitered Ribbon Logo Arrowhead -->
  <g transform="translate(16, 16) scale(1.5)">
    <!-- Segment 1: Left Vertical Bar -->
    <path 
      d="M18 14 L26 6 L26 52 L18 44 Z" 
      class="logo-shape" 
    />
    <!-- Segment 2: Top Diagonal Bar -->
    <path 
      d="M28 6 L48 26 L42 32 L20 12 Z" 
      class="logo-shape" 
    />
    <!-- Segment 3: Bottom Return Chevron -->
    <path 
      d="M48 26 L28 46 L32 38 L24 30 Z" 
      class="logo-shape" 
    />
  </g>
</svg>
